[project]
name = "piaware-adsb"
version = "0.1.0"
description = "Home Assistant integration for PiAware / tar1090 ADS-B with an Assist voice intent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component>=0.13.100",
    "tzdata",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
